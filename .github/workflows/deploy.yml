# Builds the app and publishes the result to the repository that serves
# https://odis.github.io. That repository holds nothing but the build output, so
# a deploy replaces its contents wholesale.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"
  PAGES_REPOSITORY: "domduerr/odis.github.io"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk

      # Trunk downloads its own tailwindcss and wasm-opt on first use. The
      # `data-wasm-opt="z"` attribute in index.html is what enables the latter:
      # trunk runs no optimisation at all unless the Rust asset is declared
      # explicitly, which took the bundle from 1860KB to 1093KB (383KB rather
      # than 442KB gzipped) and the branch-and-bound search from 32.0ms to
      # 29.3ms. -Oz measured fastest as well as smallest here, tying -O3 and
      # -O4 on speed; -O1 gzips 25KB smaller but gives the speed back. Adding
      # fat LTO on top is worse on both counts, which is why Cargo.toml carries
      # no [profile.release].
      - run: trunk build --release

      - name: Report bundle size
        run: |
          for f in dist/*.wasm; do
            echo "::notice::$(basename "$f") is $(( $(stat -c %s "$f") / 1024 ))KB, $(( $(gzip -9 -c "$f" | wc -c) / 1024 ))KB gzipped"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to ${{ github.event.repository.name }}.github.io
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::PAGES_DEPLOY_KEY is not set. Add the private half of a" \
                 "deploy key that has write access to $PAGES_REPOSITORY."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:${PAGES_REPOSITORY}.git" site

          # Built file names carry a content hash, so yesterday's bundle would
          # linger forever if the tree were merely overwritten.
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. site/

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::The build is identical to what is already published."
            exit 0
          fi
          version=$(grep -m1 '^version' "$GITHUB_WORKSPACE/Cargo.toml" | cut -d'"' -f2)
          git commit -m "v${version}" -m "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
