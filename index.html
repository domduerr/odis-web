<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Odis-Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dhbw: {
              gray: '#5C6971',
              red: '#E2001A',
              'gray-25': 'rgba(92, 105, 113, 0.25)',
              'gray-50': 'rgba(92, 105, 113, 0.5)',
              'gray-75': 'rgba(92, 105, 113, 0.75)',
            }
          }
        }
      }
    }
  </script>
  <style>
    input[type="checkbox"]:hover {
      accent-color: brightness(1.5);
    }
    table {
      border-collapse: collapse;
    }
    .prevent-select {
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    li:not(:last-child) {
      padding-bottom: 15px;
    }
  </style>
</head>

<body></body>

</html>
